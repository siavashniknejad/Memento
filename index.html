<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SiaMind</title>

<!-- PWA setup -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f2e4c">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #eef5f8;
    --ink: #0f2e4c;
    --accent: #1f5f8b;
    --accent-light: #dceaf1;
    --card-bg: #ffffff;
    --border: #cddce4;
    --danger: #c0533f;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: var(--bg);
    color: var(--ink);
    margin: 0;
    padding: 24px;
    max-width: 480px;
    margin-inline: auto;
  }
  h1 {
    font-size: 22px;
    margin-bottom: 4px;
  }
  .subtitle {
    color: #4d7593;
    font-size: 14px;
    margin-bottom: 24px;
  }
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .panel {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .panel h2 {
    font-size: 15px;
    margin: 0 0 12px 0;
    color: var(--accent);
  }
  input, textarea {
    width: 100%;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    margin-bottom: 8px;
    font-family: inherit;
  }
  button {
    background: var(--accent);
    color: white;
    border: none;
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
  }
  button:hover { opacity: 0.9; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.secondary {
    background: var(--accent-light);
    color: var(--accent);
  }
  button.link {
    background: none;
    color: var(--accent);
    padding: 4px;
    text-decoration: underline;
    font-size: 13px;
  }
  .icon-btn {
    background: none;
    color: var(--accent);
    padding: 4px 8px;
    font-size: 15px;
    line-height: 1;
  }
  .icon-btn.delete {
    color: var(--danger);
  }
  .icon-btn:hover {
    opacity: 0.7;
  }
  #deckList, #cardList {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  #deckList li, #cardList li {
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 8px;
  }
  #deckList li.active {
    border-color: var(--accent);
    background: var(--accent-light);
  }
  .deck-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    cursor: pointer;
  }
  #cardList li {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    font-size: 13px;
  }
  #cardList .card-text {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .review-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px 16px;
    text-align: center;
    min-height: 100px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    margin-bottom: 12px;
    white-space: pre-line;
  }
  .review-actions {
    display: flex;
    gap: 8px;
    justify-content: center;
  }
  .review-actions button {
    flex: 1;
  }
  .known { background: var(--accent); }
  .unknown { background: var(--danger); }
  .hidden { display: none; }
  .empty-note {
    color: #6f8ba0;
    font-size: 13px;
    text-align: center;
    padding: 8px;
  }
  .lookup-row {
    display: flex;
    gap: 8px;
  }
  .lookup-row input {
    flex: 1;
  }
  .lookup-row button {
    white-space: nowrap;
  }
  .error-text {
    color: var(--danger);
    font-size: 13px;
    margin: -4px 0 8px 0;
  }

  /* ---- Lookup result card ---- */
  .lookup-result {
    background: var(--accent-light);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    margin: 4px 0 12px 0;
  }
  .lookup-result-header {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 8px;
  }
  .lookup-word {
    font-size: 18px;
    font-weight: 700;
    color: var(--ink);
  }
  .badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 999px;
    line-height: 1.6;
  }
  .badge-pos {
    background: var(--card-bg);
    color: var(--accent);
    border: 1px solid var(--border);
    font-style: italic;
    font-weight: 500;
  }
  .badge-level {
    background: var(--accent);
    color: #ffffff;
  }
  .lookup-definition {
    font-size: 14px;
    color: var(--ink);
    margin-bottom: 10px;
  }
  .lookup-example {
    font-size: 13px;
    color: var(--accent);
    background: var(--card-bg);
    border-left: 3px solid var(--accent);
    border-radius: 4px;
    padding: 8px 10px;
    margin-bottom: 10px;
    font-style: italic;
  }
  .synonyms-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: #4d7593;
    margin-bottom: 6px;
  }
  .synonym-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .synonym-chip {
    background: var(--card-bg);
    border: 1px solid var(--border);
    color: var(--accent);
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 999px;
  }
</style>
</head>
<body>

  <!-- ============================================================ -->
  <!-- AUTH SCREEN (shown when logged out)                           -->
  <!-- ============================================================ -->
  <div id="authScreen">
    <h1>SiaMind</h1>
    <p class="subtitle">Your space to remember</p>

    <div class="panel">
      <h2 id="authTitle">Log in</h2>
      <p class="error-text hidden" id="authError"></p>
      <input type="email" id="authEmail" placeholder="Email">
      <input type="password" id="authPassword" placeholder="Password (min 8 characters)">
      <button id="authSubmitBtn">Log in</button>
      <p style="text-align:center; margin-top: 12px;">
        <button type="button" class="link" id="authToggleBtn">Need an account? Register</button>
      </p>
    </div>
  </div>

  <!-- ============================================================ -->
  <!-- MAIN APP (shown when logged in)                                -->
  <!-- ============================================================ -->
  <div id="appScreen" class="hidden">
    <div class="top-bar">
      <div>
        <h1>SiaMind</h1>
        <p class="subtitle">Your space to remember</p>
      </div>
      <button type="button" class="link" id="logoutBtn">Log out</button>
    </div>

    <!-- Create deck -->
    <div class="panel">
      <h2>Create a new deck</h2>
      <input type="text" id="deckNameInput" placeholder="Deck name, e.g. Spanish Vocab">
      <button id="addDeckBtn">Create deck</button>
    </div>

    <!-- Deck list -->
    <div class="panel">
      <h2>My decks</h2>
      <ul id="deckList">
        <li class="empty-note">No decks yet</li>
      </ul>
    </div>

    <!-- Add / edit card -->
    <div class="panel">
      <h2>Add a card</h2>
      <p class="empty-note" id="noDeckSelected">Select a deck first</p>
      <div id="addCardForm" class="hidden">
        <div class="lookup-row">
          <input type="text" id="questionInput" placeholder="Word">
          <button type="button" class="secondary" id="lookupBtn">Look up</button>
        </div>
        <p class="empty-note hidden" id="lookupStatus"></p>
        <div class="lookup-result hidden" id="lookupResult">
          <div class="lookup-result-header">
            <span class="lookup-word" id="resultWord"></span>
            <span class="badge badge-pos hidden" id="resultPos"></span>
            <span class="badge badge-level hidden" id="resultLevel"></span>
          </div>
          <p class="lookup-definition" id="resultDefinition"></p>
          <p class="lookup-example hidden" id="resultExample"></p>
          <div id="resultSynonymsBlock" class="hidden">
            <div class="synonyms-label">Synonyms</div>
            <div class="synonym-chips" id="resultSynonyms"></div>
          </div>
        </div>
        <textarea id="answerInput" rows="3" placeholder="Meaning / answer"></textarea>
        <button id="addCardBtn">Add card</button>
        <button type="button" class="secondary hidden" id="cancelEditBtn">Cancel edit</button>

        <ul id="cardList"></ul>
      </div>
    </div>

    <!-- Review mode -->
    <div class="panel">
      <h2>Review</h2>
      <div class="review-card" id="reviewCard">
        Select a deck to review its cards
      </div>
      <div class="review-actions">
        <button class="secondary" id="showAnswerBtn">Show answer</button>
      </div>
      <div class="review-actions hidden" id="knowActions">
        <button class="unknown" id="unknownBtn">I didn't know it</button>
        <button class="known" id="knownBtn">I knew it</button>
      </div>
    </div>
  </div>

  <script>
    // ================================================================
    // API SETUP
    // ================================================================
    const API_BASE = 'https://siamind.novinapp.net';
    const TOKEN_KEY = 'siamind_token';

    function getToken() {
      return localStorage.getItem(TOKEN_KEY);
    }
    function setToken(token) {
      localStorage.setItem(TOKEN_KEY, token);
    }
    function clearToken() {
      localStorage.removeItem(TOKEN_KEY);
    }

    // A small wrapper around fetch() that automatically attaches the
    // login token, and throws a normal JS Error on any non-2xx response
    // so calling code can just use try/catch.
    async function api(path, options) {
      options = options || {};
      const headers = Object.assign({ 'Content-Type': 'application/json' }, options.headers || {});
      const token = getToken();
      if (token) {
        headers['Authorization'] = 'Bearer ' + token;
      }

      const response = await fetch(API_BASE + path, {
        method: options.method || 'GET',
        headers: headers,
        body: options.body ? JSON.stringify(options.body) : undefined
      });

      if (response.status === 204) {
        return null; // no content (e.g. successful DELETE)
      }

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || 'Request failed');
      }

      return data;
    }

    // ================================================================
    // ELEMENTS
    // ================================================================
    const authScreen = document.getElementById('authScreen');
    const appScreen = document.getElementById('appScreen');
    const authTitle = document.getElementById('authTitle');
    const authError = document.getElementById('authError');
    const authEmail = document.getElementById('authEmail');
    const authPassword = document.getElementById('authPassword');
    const authSubmitBtn = document.getElementById('authSubmitBtn');
    const authToggleBtn = document.getElementById('authToggleBtn');
    const logoutBtn = document.getElementById('logoutBtn');

    const deckNameInput = document.getElementById('deckNameInput');
    const addDeckBtn = document.getElementById('addDeckBtn');
    const deckListEl = document.getElementById('deckList');
    const noDeckSelected = document.getElementById('noDeckSelected');
    const addCardForm = document.getElementById('addCardForm');
    const questionInput = document.getElementById('questionInput');
    const answerInput = document.getElementById('answerInput');
    const addCardBtn = document.getElementById('addCardBtn');
    const cancelEditBtn = document.getElementById('cancelEditBtn');
    const cardListEl = document.getElementById('cardList');
    const lookupBtn = document.getElementById('lookupBtn');
    const lookupStatus = document.getElementById('lookupStatus');
    const lookupResult = document.getElementById('lookupResult');
    const resultWord = document.getElementById('resultWord');
    const resultPos = document.getElementById('resultPos');
    const resultLevel = document.getElementById('resultLevel');
    const resultDefinition = document.getElementById('resultDefinition');
    const resultExample = document.getElementById('resultExample');
    const resultSynonymsBlock = document.getElementById('resultSynonymsBlock');
    const resultSynonyms = document.getElementById('resultSynonyms');
    const reviewCard = document.getElementById('reviewCard');
    const showAnswerBtn = document.getElementById('showAnswerBtn');
    const knowActions = document.getElementById('knowActions');
    const knownBtn = document.getElementById('knownBtn');
    const unknownBtn = document.getElementById('unknownBtn');

    // ================================================================
    // STATE
    // ================================================================
    let isRegisterMode = false;
    let decks = [];
    let selectedDeckId = null;
    let cardsInSelectedDeck = [];
    let editingCardId = null;
    let currentReviewCard = null;

    // ================================================================
    // AUTH SCREEN
    // ================================================================
    authToggleBtn.addEventListener('click', function () {
      isRegisterMode = !isRegisterMode;
      authTitle.textContent = isRegisterMode ? 'Register' : 'Log in';
      authSubmitBtn.textContent = isRegisterMode ? 'Register' : 'Log in';
      authToggleBtn.textContent = isRegisterMode
        ? 'Already have an account? Log in'
        : 'Need an account? Register';
      authError.classList.add('hidden');
    });

    authSubmitBtn.addEventListener('click', async function () {
      const email = authEmail.value.trim();
      const password = authPassword.value;

      authError.classList.add('hidden');
      authSubmitBtn.disabled = true;

      try {
        const path = isRegisterMode ? '/auth/register' : '/auth/login';
        const data = await api(path, { method: 'POST', body: { email: email, password: password } });
        setToken(data.token);
        authPassword.value = '';
        await enterApp();
      } catch (error) {
        authError.textContent = error.message;
        authError.classList.remove('hidden');
      } finally {
        authSubmitBtn.disabled = false;
      }
    });

    logoutBtn.addEventListener('click', function () {
      clearToken();
      decks = [];
      selectedDeckId = null;
      cardsInSelectedDeck = [];
      appScreen.classList.add('hidden');
      authScreen.classList.remove('hidden');
    });

    async function enterApp() {
      authScreen.classList.add('hidden');
      appScreen.classList.remove('hidden');
      await loadDecks();
    }

    // On page load: if we already have a token, try to use it.
    // If it's expired/invalid, the API call fails and we fall back
    // to the login screen.
    (async function init() {
      if (getToken()) {
        try {
          await enterApp();
        } catch (error) {
          clearToken();
        }
      }
    })();

    // ================================================================
    // DECKS
    // ================================================================
    async function loadDecks() {
      decks = await api('/decks');
      renderDeckList();
    }

    addDeckBtn.addEventListener('click', async function () {
      const name = deckNameInput.value.trim();
      if (name === '') {
        return;
      }
      addDeckBtn.disabled = true;
      try {
        await api('/decks', { method: 'POST', body: { name: name } });
        deckNameInput.value = '';
        await loadDecks();
      } catch (error) {
        alert(error.message);
      } finally {
        addDeckBtn.disabled = false;
      }
    });

    function renderDeckList() {
      deckListEl.innerHTML = '';

      if (decks.length === 0) {
        deckListEl.innerHTML = '<li class="empty-note">No decks yet</li>';
        return;
      }

      decks.forEach(function (deck) {
        const li = document.createElement('li');
        if (deck.id === selectedDeckId) {
          li.classList.add('active');
        }

        const row = document.createElement('div');
        row.className = 'deck-row';

        const label = document.createElement('span');
        label.style.flex = '1';
        label.textContent = deck.name + ' (' + deck.card_count + ' cards)';
        label.addEventListener('click', function () {
          selectDeck(deck.id);
        });

        const deleteBtn = document.createElement('button');
        deleteBtn.type = 'button';
        deleteBtn.className = 'icon-btn delete';
        deleteBtn.textContent = '🗑';
        deleteBtn.title = 'Delete deck';
        deleteBtn.addEventListener('click', async function (event) {
          event.stopPropagation();
          const confirmed = confirm('Delete deck "' + deck.name + '" and all its cards?');
          if (!confirmed) {
            return;
          }
          try {
            await api('/decks/' + deck.id, { method: 'DELETE' });
            if (selectedDeckId === deck.id) {
              selectedDeckId = null;
              cardsInSelectedDeck = [];
              updateAddCardVisibility();
              renderCardList();
              startReview();
            }
            await loadDecks();
          } catch (error) {
            alert(error.message);
          }
        });

        row.appendChild(label);
        row.appendChild(deleteBtn);
        li.appendChild(row);
        deckListEl.appendChild(li);
      });
    }

    async function selectDeck(deckId) {
      selectedDeckId = deckId;
      editingCardId = null;
      renderDeckList();
      updateAddCardVisibility();
      await loadCards();
      startReview();
    }

    function updateAddCardVisibility() {
      if (selectedDeckId === null) {
        noDeckSelected.classList.remove('hidden');
        addCardForm.classList.add('hidden');
      } else {
        noDeckSelected.classList.add('hidden');
        addCardForm.classList.remove('hidden');
      }
    }

    // ================================================================
    // CARDS
    // ================================================================
    async function loadCards() {
      cardsInSelectedDeck = await api('/decks/' + selectedDeckId + '/cards');
      renderCardList();
    }

    addCardBtn.addEventListener('click', async function () {
      const front = questionInput.value.trim();
      const back = answerInput.value.trim();

      if (front === '' || back === '') {
        return;
      }

      addCardBtn.disabled = true;
      try {
        if (editingCardId === null) {
          await api('/decks/' + selectedDeckId + '/cards', {
            method: 'POST',
            body: { front: front, back: back }
          });
        } else {
          await api('/cards/' + editingCardId, {
            method: 'PUT',
            body: { front: front, back: back }
          });
          editingCardId = null;
          cancelEditBtn.classList.add('hidden');
          addCardBtn.textContent = 'Add card';
        }

        questionInput.value = '';
        answerInput.value = '';
        lookupResult.classList.add('hidden');
        lookupStatus.classList.add('hidden');
        await loadDecks();   // refresh card counts
        await loadCards();
        if (currentReviewCard === null) {
          startReview();
        }
      } catch (error) {
        alert(error.message);
      } finally {
        addCardBtn.disabled = false;
      }
    });

    cancelEditBtn.addEventListener('click', function () {
      editingCardId = null;
      questionInput.value = '';
      answerInput.value = '';
      addCardBtn.textContent = 'Add card';
      cancelEditBtn.classList.add('hidden');
      lookupResult.classList.add('hidden');
      lookupStatus.classList.add('hidden');
    });

    function renderCardList() {
      cardListEl.innerHTML = '';

      cardsInSelectedDeck.forEach(function (card) {
        const li = document.createElement('li');

        const textSpan = document.createElement('span');
        textSpan.className = 'card-text';
        textSpan.textContent = card.front + ' — ' + card.back;

        const editBtn = document.createElement('button');
        editBtn.type = 'button';
        editBtn.className = 'icon-btn';
        editBtn.textContent = '✎';
        editBtn.title = 'Edit card';
        editBtn.addEventListener('click', function () {
          editingCardId = card.id;
          questionInput.value = card.front;
          answerInput.value = card.back;
          addCardBtn.textContent = 'Save changes';
          cancelEditBtn.classList.remove('hidden');
          questionInput.focus();
        });

        const deleteBtn = document.createElement('button');
        deleteBtn.type = 'button';
        deleteBtn.className = 'icon-btn delete';
        deleteBtn.textContent = '🗑';
        deleteBtn.title = 'Delete card';
        deleteBtn.addEventListener('click', async function () {
          const confirmed = confirm('Delete this card?');
          if (!confirmed) {
            return;
          }
          try {
            await api('/cards/' + card.id, { method: 'DELETE' });
            if (editingCardId === card.id) {
              cancelEditBtn.click();
            }
            await loadDecks();
            await loadCards();
            startReview();
          } catch (error) {
            alert(error.message);
          }
        });

        li.appendChild(textSpan);
        li.appendChild(editBtn);
        li.appendChild(deleteBtn);
        cardListEl.appendChild(li);
      });
    }

    // ================================================================
    // REVIEW
    // ================================================================
    function startReview() {
      knowActions.classList.add('hidden');
      showAnswerBtn.classList.remove('hidden');

      if (selectedDeckId === null) {
        reviewCard.textContent = 'Select a deck to review its cards';
        currentReviewCard = null;
        return;
      }

      if (cardsInSelectedDeck.length === 0) {
        reviewCard.textContent = 'This deck has no cards yet';
        currentReviewCard = null;
        return;
      }

      // Random card from the whole deck (see project docs for why —
      // same choice as the earlier localStorage version).
      const randomIndex = Math.floor(Math.random() * cardsInSelectedDeck.length);
      currentReviewCard = cardsInSelectedDeck[randomIndex];
      reviewCard.textContent = currentReviewCard.front;
    }

    showAnswerBtn.addEventListener('click', function () {
      if (currentReviewCard === null) {
        return;
      }
      let text = currentReviewCard.back;
      if (currentReviewCard.example) {
        text += '\n\nExample: ' + currentReviewCard.example;
      }
      reviewCard.textContent = text;
      showAnswerBtn.classList.add('hidden');
      knowActions.classList.remove('hidden');
    });

    async function answerReview(knewIt) {
      if (currentReviewCard === null) {
        return;
      }
      try {
        await api('/cards/' + currentReviewCard.id + '/review', {
          method: 'PATCH',
          body: { knewIt: knewIt }
        });
      } catch (error) {
        console.error('Failed to save review result:', error);
      }
      startReview();
    }

    knownBtn.addEventListener('click', function () { answerReview(true); });
    unknownBtn.addEventListener('click', function () { answerReview(false); });

    // ================================================================
    // DICTIONARY LOOKUP (unchanged — still calls our backend)
    // ================================================================
    lookupBtn.addEventListener('click', async function () {
      const word = questionInput.value.trim();
      if (word === '') {
        return;
      }

      lookupStatus.classList.remove('hidden');
      lookupStatus.textContent = 'Looking up "' + word + '"...';
      lookupResult.classList.add('hidden');
      lookupBtn.disabled = true;

      try {
        const data = await api('/define', { method: 'POST', body: { word: word } });
        renderLookupResult(data);

        // Keep existing behavior: the editable answer field is still
        // pre-filled with definition + example, and the user can edit
        // it before saving the card — unchanged from before.
        let result = data.definition || '';
        if (data.example) {
          result += '\n\nExample: ' + data.example;
        }
        answerInput.value = result;

        lookupStatus.textContent = 'Found a definition — feel free to edit it below before saving.';
      } catch (error) {
        lookupResult.classList.add('hidden');
        lookupStatus.textContent = 'Could not reach the lookup service. Try typing the meaning yourself.';
      } finally {
        lookupBtn.disabled = false;
      }
    });

    // Fills in the rich lookup-result card (word, part of speech, CEFR
    // level, definition, example, synonyms). Any field that's missing
    // or empty is hidden rather than shown as blank/"undefined".
    function renderLookupResult(data) {
      resultWord.textContent = data.word || '';

      if (data.partOfSpeech) {
        resultPos.textContent = data.partOfSpeech;
        resultPos.classList.remove('hidden');
      } else {
        resultPos.classList.add('hidden');
      }

      if (data.level) {
        resultLevel.textContent = data.level;
        resultLevel.classList.remove('hidden');
      } else {
        resultLevel.classList.add('hidden');
      }

      resultDefinition.textContent = data.definition || '';

      if (data.example) {
        resultExample.textContent = data.example;
        resultExample.classList.remove('hidden');
      } else {
        resultExample.classList.add('hidden');
      }

      resultSynonyms.innerHTML = '';
      if (Array.isArray(data.synonyms) && data.synonyms.length > 0) {
        data.synonyms.forEach(function (synonym) {
          const chip = document.createElement('span');
          chip.className = 'synonym-chip';
          chip.textContent = synonym;
          resultSynonyms.appendChild(chip);
        });
        resultSynonymsBlock.classList.remove('hidden');
      } else {
        resultSynonymsBlock.classList.add('hidden');
      }

      lookupResult.classList.remove('hidden');
    }

    // ================================================================
    // SERVICE WORKER
    // ================================================================
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js');
      });
    }
  </script>

</body>
