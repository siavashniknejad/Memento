<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Cards — Flashcards</title>

<!-- PWA setup -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3f6f5e">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #faf9f7;
    --ink: #1f2620;
    --accent: #3f6f5e;
    --accent-light: #e8f0ec;
    --card-bg: #ffffff;
    --border: #dcd9d3;
    --danger: #b5533c;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: var(--bg);
    color: var(--ink);
    margin: 0;
    padding: 24px;
    max-width: 480px;
    margin-inline: auto;
  }
  h1 {
    font-size: 22px;
    margin-bottom: 4px;
  }
  .subtitle {
    color: #6b7268;
    font-size: 14px;
    margin-bottom: 24px;
  }
  .panel {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .panel h2 {
    font-size: 15px;
    margin: 0 0 12px 0;
    color: var(--accent);
  }
  input, textarea {
    width: 100%;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    margin-bottom: 8px;
    font-family: inherit;
  }
  button {
    background: var(--accent);
    color: white;
    border: none;
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
  }
  button:hover { opacity: 0.9; }
  button.secondary {
    background: var(--accent-light);
    color: var(--accent);
  }
  #deckList {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  #deckList li {
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 8px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  #deckList li.active {
    border-color: var(--accent);
    background: var(--accent-light);
  }
  .review-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px 16px;
    text-align: center;
    min-height: 100px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    margin-bottom: 12px;
  }
  .review-actions {
    display: flex;
    gap: 8px;
    justify-content: center;
  }
  .review-actions button {
    flex: 1;
  }
  .known { background: var(--accent); }
  .unknown { background: var(--danger); }
  .hidden { display: none; }
  .empty-note {
    color: #8a8f89;
    font-size: 13px;
    text-align: center;
    padding: 8px;
  }
</style>
</head>
<body>

  <h1>My Cards</h1>
  <p class="subtitle">Step 1: layout only — no logic wired up yet</p>

  <!-- Create deck -->
  <div class="panel">
    <h2>Create a new deck</h2>
    <input type="text" id="deckNameInput" placeholder="Deck name, e.g. Spanish Vocab">
    <button id="addDeckBtn">Create deck</button>
  </div>

  <!-- Deck list -->
  <div class="panel">
    <h2>My decks</h2>
    <ul id="deckList">
      <li class="empty-note">No decks yet</li>
    </ul>
  </div>

  <!-- Add card -->
  <div class="panel">
    <h2>Add a card</h2>
    <p class="empty-note" id="noDeckSelected">Select a deck first</p>
    <div id="addCardForm" class="hidden">
      <input type="text" id="questionInput" placeholder="Question">
      <input type="text" id="answerInput" placeholder="Answer">
      <button id="addCardBtn">Add card</button>
    </div>
  </div>

  <!-- Review mode -->
  <div class="panel">
    <h2>Review</h2>
    <div class="review-card" id="reviewCard">
      Select a deck to review its cards
    </div>
    <div class="review-actions">
      <button class="secondary" id="showAnswerBtn">Show answer</button>
    </div>
    <div class="review-actions hidden" id="knowActions">
      <button class="unknown" id="unknownBtn">I didn't know it</button>
      <button class="known" id="knownBtn">I knew it</button>
    </div>
    <p class="empty-note" id="scheduleInfo"></p>
  </div>

  <script>
    // ----- STATE -----
    // This array is our "database" for now — just a variable in memory.
    // Each deck is an object: { name: "...", cards: [] }
    let decks = [];

    // Keeps track of which deck the user has clicked on.
    // We store its position (index) in the decks array. null = none selected.
    let selectedDeckIndex = null;

    // ----- SAVING & LOADING (localStorage) -----
    // localStorage can only store strings, so we convert our `decks`
    // array to a JSON string to save it, and parse it back to an
    // array/objects when loading.
    const STORAGE_KEY = 'flashcards-decks';

    function saveDecks() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(decks));
    }

    function loadDecks() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) {
        return []; // nothing saved yet
      }

      const parsed = JSON.parse(raw);

      // IMPORTANT: JSON has no "Date" type. When we saved, each
      // card's dueDate became a plain string like "2026-08-31T00:00:00.000Z".
      // We need to manually convert those strings back into real
      // Date objects, otherwise isDue()'s "<=" comparison won't work.
      parsed.forEach(function (deck) {
        deck.cards.forEach(function (card) {
          card.dueDate = new Date(card.dueDate);
        });
      });

      return parsed;
    }

    // Load any previously saved decks when the page starts.
    decks = loadDecks();
    const deckNameInput = document.getElementById('deckNameInput');
    const addDeckBtn = document.getElementById('addDeckBtn');
    const deckListEl = document.getElementById('deckList');
    const noDeckSelected = document.getElementById('noDeckSelected');
    const addCardForm = document.getElementById('addCardForm');
    const questionInput = document.getElementById('questionInput');
    const answerInput = document.getElementById('answerInput');
    const addCardBtn = document.getElementById('addCardBtn');
    const reviewCard = document.getElementById('reviewCard');
    const showAnswerBtn = document.getElementById('showAnswerBtn');
    const knowActions = document.getElementById('knowActions');
    const knownBtn = document.getElementById('knownBtn');
    const unknownBtn = document.getElementById('unknownBtn');
    const scheduleInfo = document.getElementById('scheduleInfo');

    // ----- TODO 1: CREATE A DECK -----
    addDeckBtn.addEventListener('click', function () {
      const name = deckNameInput.value.trim(); // trim removes extra spaces

      if (name === '') {
        return; // do nothing if the input was empty
      }

      decks.push({ name: name, cards: [] });
      deckNameInput.value = ''; // clear the input box

      saveDecks();
      renderDeckList(); // redraw the list on screen
    });

    // ----- TODO 2: SELECT A DECK -----
    function selectDeck(index) {
      selectedDeckIndex = index;
      renderDeckList();      // redraw so the selected one gets highlighted
      updateAddCardVisibility();
      startReview();         // load a card from the newly selected deck
    }

    function updateAddCardVisibility() {
      if (selectedDeckIndex === null) {
        noDeckSelected.classList.remove('hidden');
        addCardForm.classList.add('hidden');
      } else {
        noDeckSelected.classList.add('hidden');
        addCardForm.classList.remove('hidden');
      }
    }

    // ----- RENDER FUNCTION -----
    // This function's only job is: look at the `decks` array,
    // and redraw the <ul> to match it. We call this every time
    // decks or selectedDeckIndex changes.
    function renderDeckList() {
      deckListEl.innerHTML = ''; // clear the current list

      if (decks.length === 0) {
        deckListEl.innerHTML = '<li class="empty-note">No decks yet</li>';
        return;
      }

      decks.forEach(function (deck, index) {
        const li = document.createElement('li');
        li.textContent = deck.name + ' (' + deck.cards.length + ' cards)';

        if (index === selectedDeckIndex) {
          li.classList.add('active');
        }

        li.addEventListener('click', function () {
          selectDeck(index);
        });

        deckListEl.appendChild(li);
      });
    }

    // ----- TODO 3: ADD A CARD -----
    addCardBtn.addEventListener('click', function () {
      // Guard clause: if no deck is selected, do nothing.
      // (Shouldn't normally happen since the form is hidden, but it's
      // good practice to protect the function anyway.)
      if (selectedDeckIndex === null) {
        return;
      }

      const question = questionInput.value.trim();
      const answer = answerInput.value.trim();

      if (question === '' || answer === '') {
        return; // require both fields
      }

      const deck = decks[selectedDeckIndex];
      deck.cards.push({
        question: question,
        answer: answer,
        // SM-2 scheduling fields — every new card starts like this:
        repetitions: 0,
        easeFactor: 2.5,
        interval: 0,
        dueDate: new Date() // due immediately, since it's never been reviewed
      });

      questionInput.value = '';
      answerInput.value = '';

      saveDecks();
      renderDeckList(); // so the "(N cards)" count updates

      // If the review panel was showing "no cards yet", refresh it
      // now that this deck has at least one card.
      if (currentReviewCardIndex === null) {
        startReview();
      }
    });

    // TODO 4: In review mode, show a random card from the selected deck.
    // Clicking "Show answer" reveals the answer and shows the
    // "I knew it / I didn't know it" buttons.

    // Keeps track of which card (by index within the deck's cards array)
    // is currently being shown in the review panel.
    let currentReviewCardIndex = null;

    // Returns true if a card's dueDate is today or earlier.
    function isDue(card) {
      return card.dueDate <= new Date();
    }

    function startReview() {
      // Reset the answer/buttons back to their initial state
      knowActions.classList.add('hidden');
      showAnswerBtn.classList.remove('hidden');

      if (selectedDeckIndex === null) {
        reviewCard.textContent = 'Select a deck to review its cards';
        currentReviewCardIndex = null;
        return;
      }

      const deck = decks[selectedDeckIndex];

      if (deck.cards.length === 0) {
        reviewCard.textContent = 'This deck has no cards yet';
        currentReviewCardIndex = null;
        return;
      }

      // NOTE: For now we pick randomly from ALL cards, not just due ones,
      // so review feels random every time you open the app while testing.
      // The SM-2 fields (dueDate, interval, etc.) are still being tracked
      // in the background — later we can switch back to due-only filtering
      // for "real" spaced repetition once you're ready.
      const randomIndex = Math.floor(Math.random() * deck.cards.length);
      currentReviewCardIndex = randomIndex;
      const card = deck.cards[currentReviewCardIndex];
      reviewCard.textContent = card.question;
    }

    // ----- SM-2 SCHEDULING -----
    // Updates a card's repetitions/easeFactor/interval/dueDate
    // based on whether the user knew it or not.
    function scheduleCard(card, knewIt) {
      if (!knewIt) {
        card.repetitions = 0;
        card.interval = 1;
        card.easeFactor = Math.max(1.3, card.easeFactor - 0.2);
      } else {
        card.repetitions += 1;

        if (card.repetitions === 1) {
          card.interval = 1;
        } else if (card.repetitions === 2) {
          card.interval = 6;
        } else {
          card.interval = Math.round(card.interval * card.easeFactor);
        }

        card.easeFactor = card.easeFactor + 0.1;
      }

      // Set the new due date: today + interval days
      const newDueDate = new Date();
      newDueDate.setDate(newDueDate.getDate() + card.interval);
      card.dueDate = newDueDate;
    }

    showAnswerBtn.addEventListener('click', function () {
      if (selectedDeckIndex === null || currentReviewCardIndex === null) {
        return;
      }
      const deck = decks[selectedDeckIndex];
      const card = deck.cards[currentReviewCardIndex];

      reviewCard.textContent = card.answer;
      showAnswerBtn.classList.add('hidden');
      knowActions.classList.remove('hidden');
    });

    knownBtn.addEventListener('click', function () {
      const deck = decks[selectedDeckIndex];
      const card = deck.cards[currentReviewCardIndex];
      scheduleCard(card, true);
      showScheduleDebugInfo(card);
      saveDecks();
      startReview(); // move on to another due card
    });

    unknownBtn.addEventListener('click', function () {
      const deck = decks[selectedDeckIndex];
      const card = deck.cards[currentReviewCardIndex];
      scheduleCard(card, false);
      showScheduleDebugInfo(card);
      saveDecks();
      startReview(); // move on to another due card
    });

    // TEMPORARY: prints what SM-2 just calculated, so we can verify
    // the logic works without waiting real days for cards to come due.
    // We'll remove this once we trust the algorithm.
    function showScheduleDebugInfo(card) {
      scheduleInfo.textContent =
        'Debug — interval: ' + card.interval + ' day(s), ' +
        'ease: ' + card.easeFactor.toFixed(2) + ', ' +
        'next due: ' + card.dueDate.toLocaleDateString();
    }

    // ----- INITIAL RENDER -----
    // Show whatever decks were loaded from localStorage right away.
    renderDeckList();

    // ----- REGISTER SERVICE WORKER -----
    // This is what makes the app installable and able to work offline.
    // 'serviceWorker' in navigator checks the browser actually supports it.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js');
      });
    }
  </script>

</body>
</html>
